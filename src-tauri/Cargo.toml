[package]
name = "wepo"
version = "0.3.1"
description = "WEPO: suite de oficina de código abierto para macOS"
authors = ["Ricardo Rodríguez Arellano"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wepo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Solo para las pruebas de la interfaz (examples/e2e_bridge.rs).
[dev-dependencies]
tiny_http = "0.12"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = "0.37.0"
csv = "1.4.0"
tauri-plugin-dialog = "2.8.3"
ironcalc = "0.9.1"
tauri-plugin-clipboard-manager = "2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
quick-xml = "0.42"

# Exportar como PDF con el motor de impresión de cada sistema (mismas versiones que usa Tauri).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSGeometry", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSWindow"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
