# Revisa que todo compile y que las pruebas pasen en cada cambio.
name: Revisión

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    name: Revisión (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Interfaz (TypeScript y Vite)
        run: npm run build
      - name: Núcleo (pruebas de Rust)
        working-directory: src-tauri
        run: cargo test --lib

  # Pruebas de la interfaz: abren archivos, imprimen, exportan a PDF, convierten
  # y guardan, como lo haría una persona (con Chromium y el motor de Rust de verdad).
  interfaz:
    name: Pruebas de la interfaz
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Revisar las pruebas (TypeScript)
        run: npx tsc -p e2e/tsconfig.json
      - name: Navegador de las pruebas
        run: npx playwright install --with-deps chromium
      - name: Compilar el puente de pruebas
        run: cargo build --manifest-path src-tauri/Cargo.toml --example e2e_bridge
      - name: Pruebas de la interfaz
        run: npm run test:e2e
        env:
          CI: true
      - name: Reporte (si algo falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-de-pruebas
          path: |
            playwright-report/
            test-results/
          retention-days: 14
